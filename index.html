<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riyadh Logistics Dashboard</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f5f6f8;color:#333}.loading{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.dot{width:28px;height:28px;border:3px solid #ddd;border-top-color:#c8102e;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div class="dot"></div><div>Loading Riyadh Logistics Dashboard…</div></div><script>(async()=>{try{const b64=await (await fetch('v4_payload.txt',{cache:'no-store'})).text();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<div style="padding:30px;font-family:Arial">Dashboard failed to load: '+e.message+'</div>';}})();</script></body></html>
