<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Riyadh Logistics Dashboard</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f5f6f8;color:#333}.loading{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.dot{width:28px;height:28px;border:3px solid #ddd;border-top-color:#c8102e;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div class="dot"></div><div>Loading Riyadh Logistics Dashboard…</div></div><script>(async()=>{try{const files=['v4_01.txt','v4_02.txt','v4_03.txt','v4_04.txt','v4_05.txt'];const parts=[];for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);parts.push(await r.text());}document.open();document.write(parts.join(''));document.close();}catch(e){document.body.innerHTML='<div style="padding:30px">Dashboard failed to load: '+e.message+'</div>';}})();</script></body></html>
