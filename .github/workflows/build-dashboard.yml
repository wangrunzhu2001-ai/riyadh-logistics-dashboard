name: Build Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'v4_payload.txt'
      - '.github/workflows/build-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode V4 dashboard
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = Path('v4_payload.txt').read_text(encoding='utf-8').strip()
          html = gzip.decompress(base64.b64decode(payload))
          expected = '92e4107d242ccd516f441a26ce32c62f04421b04b8405df20b9f2ea968543f2b'
          actual = hashlib.sha256(html).hexdigest()
          if actual != expected:
              raise SystemExit(f'V4 hash mismatch: {actual}')
          Path('index.html').write_bytes(html)
          print(f'Generated exact V4 index.html: {len(html):,} bytes; sha256={actual}')
          PY

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Publish exact V4 dashboard"
            git push
          fi
